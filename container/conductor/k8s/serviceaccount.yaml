# B-1173: the conductor pod's identity. The annotation binds it to the Google service account through Workload
# Identity (iam.gke.io/gcp-service-account); setup-cluster.sh steps 18-25 create the Google account, its grants
# and the impersonation binding, then create and annotate this Kubernetes account (so applying this file is
# harmless but not required). It carries NO key and NO token secret.
# Edit the annotation if you used a non-default --conductor-gsa-name or project.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harmony-conductor
  namespace: harmony-conductor
  annotations:
    iam.gke.io/gcp-service-account: harmony-conductor@harmony-conductor.iam.gserviceaccount.com
