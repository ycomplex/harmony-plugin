# Runbook: docs/remote-conductor-runbook.md (the ordered steps, system-pool sizing, the fallback).
# B-1173: the remote conductor — ONE pod running the same daemon (dist/bin/daemon.js) the Mac mini runs, holding
# the registry lease while it conducts. Everything it needs comes from three places: the image (code), the ConfigMap
# (names and identifiers), and Secret Manager at boot (HARMONY_API_TOKEN and the GitHub App key, via Workload
# Identity). NO credential appears in this file, and none must be added to it.
#
# APPLY ORDER: priorityclass.yaml FIRST (cluster-scoped; setup-cluster.sh step 27 applies it, or `kubectl apply -f
# container/conductor/k8s/priorityclass.yaml`), because this Deployment names it and the pod is rejected without it.
# The image tag below is a placeholder; the Deployment pins a VERSION tag, never a moving one (the channel
# tags :staging / :prod exist for `harmony conductor update` to resolve, not for this file):
#   sed "s/__CONDUCTOR_VERSION__/<plugin version>/" container/conductor/k8s/deployment.yaml | kubectl apply -f -
# The version is the one the Cloud Build run published (`gcloud artifacts docker tags list <image>`). After that,
# `harmony conductor update` rewrites the tag itself with `kubectl set image`.
#
# ROLLOUT: maxSurge 1 / maxUnavailable 0 means a SECOND pod starts while the first still conducts. The new pod finds
# the registry lease held, logs once and STANDS BY (no launching, readiness already passing), then boots normally
# the moment the old pod is told to stop and releases the lease. progressDeadlineSeconds bounds a rollout that
# never completes; `harmony conductor restart|update` undoes it past the deadline.
#
# SIZED FROM THE LIVE NODE (seat, 2026-10-20): harmony-legs' system node (e2-medium) has 940m CPU allocatable with
#   783m already requested by GKE system pods, leaving ~157m. A rollout runs TWO conductor pods, so each requests
#   50m (100m together); memory 2x256Mi fits easily (2.8Gi allocatable, 1.6Gi requested). There is no CPU limit,
#   so the pod still bursts when busy. Re-check with `kubectl describe node <system-node>` ("Allocated resources")
#   if the system pool changes: a surge pod that cannot schedule stays Pending and the rollout times out.
# The default pool is e2-medium (1 node) per setup-cluster.sh; its allocatable CPU/memory is shared with the
# kube-system pods, which is why this check is worth doing once.
#
# PLACEMENT: nodeSelector pins the pod to the cluster's default pool. The leg pool is tainted
# harmony-leg=true:NoSchedule and labelled harmony-leg=true; this pod has NO toleration for that taint, so it can
# never land there (and never keeps a leg node alive).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmony-conductor
  namespace: harmony-conductor
  labels:
    app.kubernetes.io/name: harmony-conductor
    app.kubernetes.io/part-of: harmony-conductor
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: harmony-conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmony-conductor
        app.kubernetes.io/part-of: harmony-conductor
    spec:
      serviceAccountName: harmony-conductor
      # Outranks leg pods when the cluster is busy; system-critical pods still outrank it (see priorityclass.yaml).
      priorityClassName: harmony-conductor
      terminationGracePeriodSeconds: 60
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: conductor
          image: us-central1-docker.pkg.dev/harmony-conductor/harmony-workers/harmony-conductor:__CONDUCTOR_VERSION__
          imagePullPolicy: IfNotPresent
          env:
            - name: HARMONY_CONDUCTOR_REMOTE
              value: '1'
            # The image path `harmony conductor update` lists tags of (no tag).
            - name: HARMONY_CONDUCTOR_IMAGE
              value: us-central1-docker.pkg.dev/harmony-conductor/harmony-workers/harmony-conductor
            # The update channel: prod, or ack:staging. Registry rows and `update` read it.
            - name: HARMONY_PLUGIN_POSTURE
              value: ack:staging
            - name: HARMONY_READY_FILE
              value: /tmp/harmony-ready
            # Writable (emptyDir): the project-file snapshot and logs. The ConfigMap is read-only at /etc/harmony.
            - name: HARMONY_HOME
              value: /var/harmony
            - name: HARMONY_CONDUCTOR_HOST_FILE
              value: /etc/harmony/conductor-host.json
            # gcp.project / gcp.region / gcloud.account and gke.storage_class come from the ConfigMap files (host +
            # project seed), not from env: a legacy CLOUDSDK_* / HARMONY_GKE_* knob is deprecated and warns at boot.
          readinessProbe:
            exec:
              command: ['sh', '-c', 'test -f "$HARMONY_READY_FILE"']
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/harmony
              readOnly: true
            - name: state
              mountPath: /var/harmony
      volumes:
        - name: config
          configMap:
            name: harmony-conductor-config
        - name: state
          emptyDir: {}
