# B-1337: the ONLY in-cluster permission container/figma/cloudbuild.yaml's repin step needs: read and patch the two
# Figma refresh CronJobs in harmony-conductor (`kubectl set image` gets, then patches). Nothing else in the namespace,
# and nothing cluster-wide. Reaching the cluster at all (`gcloud container clusters get-credentials`) is the separate
# project-level grant roles/container.clusterViewer (docs/figma-connection-rollout.md, step 7).
#
# The founder applies this; no leg does. The subject is the DEDICATED build service account
# harmony-figma-refresh-build@harmony-conductor.iam.gserviceaccount.com, created in docs/figma-connection-rollout.md
# step 7, founder step 2. It is the `--service-account` of both regional (us-central1) Figma refresh triggers, never the
# default compute service account (<number>-compute@developer.gserviceaccount.com) the other triggers run as.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harmony-figma-refresh-repin
  namespace: harmony-conductor
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [harmony-figma-refresh, harmony-figma-refresh-prod]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harmony-figma-refresh-repin
  namespace: harmony-conductor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harmony-figma-refresh-repin
subjects:
  # The triggers' dedicated service account (see the header). GKE maps a Google identity to a User subject by its email.
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: harmony-figma-refresh-build@harmony-conductor.iam.gserviceaccount.com
