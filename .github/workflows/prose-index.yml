name: Refresh configured prose index
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: prose-index-${{ github.repository }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get released Harmony CLI (0.16.41 by default)
        uses: actions/checkout@v6
        with:
          repository: ycomplex/harmony-plugin
          ref: fc1024d73375ced1a3367549820f728dead3d6f8
          path: .harmony-cli
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Move released CLI outside the source checkout
        run: mv "$GITHUB_WORKSPACE/.harmony-cli" "$RUNNER_TEMP/harmony-cli"
      - name: Publish immutable merged source snapshot
        env:
          HARMONY_API_TOKEN: ${{ secrets.HARMONY_PROSE_INDEX_TOKEN }}
        run: |
          if [ -z "$HARMONY_API_TOKEN" ]; then
            echo "::warning::HARMONY_PROSE_INDEX_TOKEN is not set; skipping the configured prose refresh for this push"
            exit 0
          fi
          node "$RUNNER_TEMP/harmony-cli/dist/bin/harmony.js" knowledge sync-prose --root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA"
