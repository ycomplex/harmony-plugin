name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # B-1007: the INVERTED gate. Under the three-branch topology `main` is SOURCE ONLY — the
      # version and the built `dist/` are GENERATED on `staging` by scripts/generate-staging.sh —
      # so a PR must NOT bump plugin.json's version and must NOT touch any path under dist/. It
      # keeps the fail-closed property of the B-778 gate it replaces (an unreadable base or an
      # unparseable manifest FAILS) and recognises exactly one exception: the B-1007 cutover commit
      # itself. The logic lives in a committed, unit-tested script (src/check-generated-artifacts.
      # test.ts) — this is only its caller. No "base" to diff against on a plain push, so this runs
      # for pull_request only.
      - name: Forbid generated artifacts in a PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          scripts/check-generated-artifacts.sh "$BASE_SHA" HEAD

  # B-1007: the staging GENERATION job — the whole reason `main` can be source-only.
  #
  # On every push to `main` (after `check` is green) it merges `main` into `staging`, patch-bumps
  # .claude-plugin/plugin.json, rebuilds dist/, and commits both as the harmony-daemon GitHub App.
  # `prod` is then fast-forwarded from `staging` by the workspace's promote-prod.sh, so this job
  # MERGES and never rewrites history — that property, the patch bump and the re-run safety all
  # live in the committed script (scripts/generate-staging.sh, unit-tested in
  # src/generate-staging.test.ts). This job is a thin caller, per this repo's convention that the
  # logic lives in a committed script rather than in workflow YAML.
  #
  # concurrency: two merges landing in quick succession must SERIALIZE, not race — the second run
  # waits rather than being cancelled, so no merged commit is ever skipped.
  generate-staging:
    name: Generate staging (version + dist)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: plugin-staging-generate
      cancel-in-progress: false
    steps:
      # The App token is what lets this job push to a protected `staging` (GITHUB_TOKEN cannot).
      # Secret NAMES only — no value is ever embedded here.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.HARMONY_APP_ID }}
          private-key: ${{ secrets.HARMONY_APP_PRIVATE_KEY }}

      # Full history: the script merges branches and walks ancestry (its re-run-safety check asks
      # whether main's tip is already an ancestor of staging), so a shallow clone will not do.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Every remote/branch/identity/build detail is env-overridable (see the script's header);
      # the defaults are exactly this repo's topology.
      - name: Generate staging (merge main, bump version, rebuild dist, push)
        run: scripts/generate-staging.sh

  # B-694: the build container's agent-portability guardrail, checked on every
  # run — the base target must stay agent-neutral (no claude in it). Light
  # image only; the heavy substrate (DinD/local Supabase) is B-708.
  #
  # B-929 extends this same job into the TOOLCHAIN CONTRACT: the base layer now
  # carries a toolchain MANAGER (fnm + the base image's corepack), so a cloned
  # repo can pin its own Node/package manager — and the properties that makes or
  # breaks are proven here, pre-merge, against a real built image. The job name
  # is deliberately UNCHANGED so an existing required-status-check rule keeps
  # matching; the added work lives in committed scripts under container/, and
  # this workflow is only their caller.
  container-base:
    name: Container base layer (agent-free)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # B-929: the toolchain-contract script runs `node dist/bin/worker-image.js`
      # (the requirements-list generator) off the dist bundle.
      #
      # B-1007: that bundle is no longer COMMITTED on `main` (it is generated on
      # `staging`), so this job now builds it itself before the contract runs.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build dist for the toolchain contract (B-1007)
        run: npm ci && npm run build

      - name: Build base target
        run: docker build -f container/Dockerfile --target base -t b694-base container

      - name: Assert no agent in base
        run: docker run --rm --entrypoint /bin/sh b694-base -c '! command -v claude'

      # B-929: everything below is one committed script (container/toolchain-contract.sh)
      # so the assertions are reviewable in the repo rather than buried in YAML.
      # It proves, in order:
      #   1. AC2 INERTNESS — a fixture repo (container/ci-fixtures/no-pins) that
      #      declares no pin still lands on the image's Node 22, persists nothing
      #      and downloads nothing. That is the shape of all three of Harmony's
      #      own repos, so this is the "shipping this changed nothing for us"
      #      assertion.
      #   2. AC1 HONOUR — container/ci-fixtures/pinned (.nvmrc 24.14.1 +
      #      packageManager pnpm@11.21.0) lands on node v24.14.1 and pnpm
      #      11.21.0, and `pnpm install --frozen-lockfile` completes.
      #   3. BUILD-GATE VERIFY (a) — container/ci-fixtures/engines-only declares
      #      ONLY engines.node (no .nvmrc) and must still land on 24.14.1. fnm's
      #      `--resolve-engines` was verified live during the B-929 build (fnm
      #      1.39.0: present, default-on, resolved a bare engines.node fixture to
      #      v24.14.1); container/activate-toolchain.sh additionally carries a
      #      flag-independent fallback that resolves engines.node itself, so this
      #      assertion holds either way.
      #   4. BUILD-GATE VERIFY (c) — runs container/smoke.sh, the EXACT script
      #      container/cloudbuild.yaml's publish gate runs between build and
      #      push, so the smoke's assertion depth is settled here rather than
      #      only on a real Cloud Build run.
      #   5. AC4 — builds an image from the requirements-list GENERATOR's output
      #      (no hand-written Dockerfile at any point) and asserts every declared
      #      binary resolves in it and that the entrypoint still dispatches.
      - name: Toolchain contract (B-929)
        run: container/toolchain-contract.sh b694-base
